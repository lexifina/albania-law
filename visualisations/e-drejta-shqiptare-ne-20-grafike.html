* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }

details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }

table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }

part('p1', 'I. Kuvendi dhe Presidenti', 'I. The Assembly and the President',
  'Ligjet që miraton Kuvendi: sa janë, kur miratohen, sa të gjata janë, çfarë tjetër vendos Kuvendi dhe si i shpall Presidenti. Nga historia e gitit, nga hyrja dhe blloku i miratimit të çdo ligji dhe nga tabelat data/laws.csv dhe data/held.json.',
  'The laws the Assembly adopts: how many, when, how long they are, what else the Assembly decides, and how the President promulgates them. From the git history, the preamble and the adoption block of every law, and the tables data/laws.csv and data/held.json.');

chart('c01', el => {
  const LW = D.c01.laws, VK = D.c01.vkm, full = r => r.y < 2026;
  const avg = rows => Math.round(d3.mean(rows.filter(full), r => r.n));
  const top = rows => rows.filter(full).reduce((a, b) => (b.n > a.n ? b : a));
  const mL = top(LW), mV = top(VK);
  const share = rows => sum(rows, r => r.held) / sum(rows, r => r.n);
  return {
    title: L(`Ligjet dhe vendimet: Kuvendi miraton mesatarisht ${fmt(avg(LW))} ligje në vit, qeveria ${fmt(avg(VK))} vendime`, `Laws and decisions: the Assembly adopts ${fmt(avg(LW))} laws a year on average, the government ${fmt(avg(VK))} decisions`),
    dek: L(`Shtylla e lehtë: sa ligje dhe sa vendime të Këshillit të Ministrave u miratuan çdo vit, sipas numrave që morën. Shtylla e plotë: ato, teksti i të cilave është në këtë repozitor; përqindja sipër është pjesa e tyre. Më shumë ligje u miratuan në vitin ${mL.y} (${fmt(mL.n)}), më shumë vendime në vitin ${mV.y} (${fmt(mV.n)}).`,
      `Light column: how many laws and how many decisions of the Council of Ministers were adopted each year, by the numbers they were given. Solid column: those whose text is in this repository; the percentage on top is their share. The most laws were adopted in ${mL.y} (${fmt(mL.n)}), the most decisions in ${mV.y} (${fmt(mV.n)}).`),
    draw(el) {
      const cols = S8();
      const panel = (rows, ink, head, sub) => {
        const p = el.append('div').style('margin', '6px 0 10px');
        p.append('h4').style('margin', '0 0 2px').style('font', '600 13px/1.3 Inter, sans-serif').text(head);
        p.append('p').style('margin', '0 0 4px').style('font-size', '12px').style('color', 'var(--text-2)').text(sub);
        legend(p, [{ c: ink + '38', l: L('Të miratuara (sipas numrave)', 'Adopted (by their numbers)') }, { c: ink, l: L('Me tekst në repozitor', 'With text in the repository') }]);
        const w = W(p), nw = narrow(w), h = nw ? 190 : 220, m = { t: 18, r: 4, b: 24, l: 40 };
        const svg = svgIn(p, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
        const iw = w - m.l - m.r, ih = h - m.t - m.b;
        const x = d3.scaleBand().domain(rows.map(r => r.y)).range([0, iw]).padding(0.2);
        const y = d3.scaleLinear().domain([0, d3.max(rows, r => r.n)]).nice().range([ih, 0]);
        yAxis(g, y, iw, 4);
        g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
        const every = nw ? 4 : (x.step() < 30 ? 2 : 1), tickEvery = nw ? 5 : 2;
        rows.forEach((r, i) => {
          const x0 = x(r.y), bw = x.bandwidth(), op = full(r) ? 1 : .5;
          g.append('path').attr('d', colPath(x0, ih, bw, y(r.n), Math.min(4, bw / 3))).attr('fill', ink).attr('fill-opacity', .22 * op);
          g.append('path').attr('d', colPath(x0, ih, bw, y(r.held), Math.min(4, bw / 3))).attr('fill', ink).attr('fill-opacity', op);
          if (i % every === 0 || (i === rows.length - 1 && (rows.length - 1) % every >= Math.min(2, every))) g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', y(r.n) - 5).attr('text-anchor', 'middle').style('font-size', nw ? '9px' : '10px').text(pct(r.held, r.n));
          if (i % tickEvery === 0) g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(r.y);
          bindTip(g.append('rect').attr('class', 'hit').attr('x', x0 - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', 0).attr('height', ih).datum(r),
            d => `<b>${d.y}${full(d) ? '' : ' (' + t('partial') + ')'}</b>` + trow(null, L('Të miratuara', 'Adopted'), fmt(d.n)) + trow(ink, L('Me tekst në repozitor', 'With text in the repository'), fmt(d.held)) + trow(null, t('share'), pct(d.held, d.n)));
        });
      };
      panel(LW, cols[0], L('Ligjet e Kuvendit', 'Laws of the Assembly'), L(`${fmt(sum(LW, r => r.n))} ligje në vitet 2000–2026; repozitori mban tekstin e ${pct(share(LW), 1)} prej tyre`, `${fmt(sum(LW, r => r.n))} laws in 2000–2026; the repository holds the text of ${pct(share(LW), 1)} of them`));
      panel(VK, cols[2], L('Vendimet e Këshillit të Ministrave', 'Decisions of the Council of Ministers'), L(`${fmt(sum(VK, r => r.n))} vendime në vitet 2000–2026; repozitori mban tekstin e ${pct(share(VK), 1)} prej tyre`, `${fmt(sum(VK, r => r.n))} decisions in 2000–2026; the repository holds the text of ${pct(share(VK), 1)} of them`));
      note(el, ['ligj/<viti>/<numri>/', 'vendim/<viti>/<numri>/', 'data/laws.csv', 'registry/data/laws.csv', 'data/held.json'], fmt(sum(LW, r => r.n) + sum(VK, r => r.n)) + L(' akte', ' acts'),
        L('numri i akteve të një viti nxirret nga numrat e tyre: ligjet numërohen nga 1 çdo vit që nga 2012 dhe vendimet e Këshillit të Ministrave çdo vit, kështu që numri më i lartë i vitit tregon sa u miratuan; para vitit 2012 ligjet kishin numra të njëpasnjëshëm, dhe për çdo vit numërohen numrat nga ligji i tij i parë deri te i pari i vitit pasardhës. Numrat merren nga çdo akt që përmend repozitori (edhe aktet që ndryshuan të tjerët dhe ato të mbajtura mënjanë). 2026 është vit i paplotë (më i zbehtë).',
          'the number of acts in a year is read from their numbers: since 2012 laws are numbered from 1 each year, and decisions of the Council of Ministers every year, so the year\'s highest number is how many were adopted; before 2012 laws had consecutive numbers, and each year counts the numbers from its first law to the first of the next year. The numbers come from every act the repository names (including acts that changed others and acts held back). 2026 is partial (lighter).'));
      table(el, [t('year'), L('Ligje', 'Laws'), L('me tekst', 'with text'), L('Vendime', 'Decisions'), L('me tekst', 'with text')], LW.map((r, i) => [String(r.y), r.n, r.held, VK[i].n, VK[i].held]));
    }
  };
});

chart('c02', el => {
  const c = D.c02, grid = c.grid, N = c.n, by = m => sum(grid.filter(x => x[1] === m), x => x[2]);
  const jul = by(7), aug = by(8), dcm = by(12), thu = c.wd[3], Y = d3.range(2000, 2027);
  return {
    title: L(`Kalendari i Kuvendit: ${pct(thu, N)} e ligjeve miratohen të enjten, ${pct(jul, N)} në korrik`, `The Assembly's calendar: ${pct(thu, N)} of laws are adopted on a Thursday, ${pct(jul, N)} in July`),
    dek: L(`Çdo rresht është një vit, çdo katror një muaj: sa më i errët, aq më shumë ligje miratoi Kuvendi atë muaj (sipas datës së miratimit të shënuar në ligj). Korriku (${pct(jul, N)}) dhe dhjetori (${pct(dcm, N)}) janë muajt më të ngarkuar; në gusht, në ${fmt(Y.length)} vjet, u miratuan vetëm ${pl(aug, 'ligj', 'ligje')}. Poshtë: ligjet sipas ditës së javës.`,
      `Each row is a year, each square a month: the darker, the more laws the Assembly adopted that month (by the date of adoption the law records). July (${pct(jul, N)}) and December (${pct(dcm, N)}) are the busiest months; in August, over ${Y.length} years, only ${aug === 1 ? 'one law was' : fmt(aug) + ' laws were'} adopted. Below: laws by weekday.`),
    draw(el) {
      const w = W(el), nw = narrow(w), rowH = nw ? 15 : 17, m = { t: 20, r: nw ? 40 : 120, b: 6, l: 38 };
      const iw = w - m.l - m.r, cw = iw / 12, h = m.t + m.b + rowH * Y.length;
      const G = new Map(grid.map(([y, mm, n]) => [y + ':' + mm, n])), mx = d3.max(grid, x => x[2]);
      const ramp = seqRamp(), col = n => ramp(0.12 + 0.88 * Math.sqrt(n / mx));
      legend(el, [1, 5, 15, mx].map(n => ({ c: col(n), l: n === mx ? L(`${n} ligje në muaj`, `${n} laws in a month`) : String(n) })).concat([{ c: css('--surface-2'), l: L('muaj pa asnjë ligj', 'a month with no law') }]));
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      MON[LANG].forEach((mn, j) => g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', -7).attr('text-anchor', 'middle').text(nw ? mn.slice(0, 1).toUpperCase() : mn));
      const tot = y => sum(grid.filter(x => x[0] === y), x => x[2]), xb = d3.scaleLinear().domain([0, d3.max(Y, tot)]).range([0, m.r - (nw ? 28 : 44)]);
      Y.forEach((y, i) => {
        const cy = i * rowH;
        g.append('text').attr('class', 'lbl strong').attr('x', -6).attr('y', cy + rowH / 2 + 4).attr('text-anchor', 'end').text(y);
        for (let mm = 1; mm <= 12; mm++) {
          if (y === 2026 && mm > +PF.built.slice(5, 7)) continue;
          const n = G.get(y + ':' + mm) || 0;
          bindTip(g.append('rect').attr('x', (mm - 1) * cw + 1).attr('y', cy + 1).attr('width', cw - 2).attr('height', rowH - 2).attr('rx', 3).attr('fill', n ? col(n) : css('--surface-2')).datum({ y, mm, n }),
            d => `<b>${L(Cap(MSQ[d.mm - 1]), MEN[d.mm - 1])} ${d.y}</b>` + trow(null, L('Ligje të miratuara', 'Laws adopted'), fmt(d.n)));
        }
        if (!nw) g.append('path').attr('d', barPath(iw + 8, cy + 4, iw + 8 + xb(tot(y)), rowH - 8, 2)).attr('fill', css('--s1')).attr('opacity', y === 2026 ? .55 : 1);
        g.append('text').attr('class', 'lbl').attr('x', iw + (nw ? 6 : 14 + xb(tot(y)))).attr('y', cy + rowH / 2 + 4).text(fmt(tot(y)));
      });
      // weekdays
      const p = el.append('div').style('margin-top', '14px');
      p.append('h4').style('margin', '0 0 4px').style('font', '600 13px/1.3 Inter, sans-serif').text(L('Ligjet sipas ditës së javës kur u miratuan', 'Laws by the weekday they were adopted'));
      const w2 = W(p), rh = 22, mm2 = { t: 2, r: 70, b: 2, l: nw ? 78 : 96 }, svg2 = svgIn(p, w2, mm2.t + mm2.b + rh * 7), g2 = svg2.append('g').attr('transform', `translate(${mm2.l},${mm2.t})`);
      const x2 = d3.scaleLinear().domain([0, d3.max(c.wd)]).range([0, w2 - mm2.l - mm2.r]);
      c.wd.forEach((n, i) => {
        g2.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', i * rh + 15).attr('text-anchor', 'end').text(Cap(WDN[LANG][i]));
        g2.append('path').attr('d', barPath(0, i * rh + 5, Math.max(2, x2(n)), 13, 3)).attr('fill', i === 3 ? css('--s1') : css('--muted-mark'));
        g2.append('text').attr('class', 'lbl').attr('x', Math.max(2, x2(n)) + 6).attr('y', i * rh + 15).text(`${fmt(n)} · ${pct(n, N)}`);
      });
      note(el, ['ligj/<viti>/<numri>/zz-miratuar.md („Miratuar në datën …“)', 'git log (Enacted:)', 'data/laws.csv', 'data/held.json'], fmt(N) + L(' ligje me datë miratimi', ' laws with an adoption date'),
        L(`data e miratimit merret nga blloku në fund të ligjit, përndryshe nga data e ligjit në regjistrin e QBZ-së. Viti 2026 shkon deri më ${dateTxt(PF.built)}.`, `the adoption date comes from the block at the end of the law, otherwise from the law's date in QBZ's record. 2026 runs to ${dateTxt(PF.built)}.`));
      table(el, [t('year'), ...MON[LANG], t('total')], Y.map(y => [String(y), ...d3.range(1, 13).map(mm => G.get(y + ':' + mm) || 0), tot(y)]));
    }
  };
});

chart('c03', el => {
  const R = D.c03.rows, CL = [[1, 5], [6, 15], [16, 30], [31, 60], [61, 1e9]];
  const CN = [L('1–5 nene', '1–5 articles'), L('6–15 nene', '6–15 articles'), L('16–30 nene', '16–30 articles'), L('31–60 nene', '31–60 articles'), L('mbi 60 nene', 'over 60 articles')];
  const rows = R.map(r => { const o = { ...r, span: `${r.lo}–${r.hi}` }; CL.forEach(([a, z], j) => o['b' + j] = r.pts.filter(p => p[0] >= a && p[0] <= z).length); return o; });
  const f = rows[0], l = rows[rows.length - 1], big = r => r.b3 + r.b4;
  return {
    title: L(`Ligjet e reja zgjaten: mediana nga ${fmt(f.med)} nene në vitet ${f.span} në ${fmt(l.med)} në vitet ${l.span}`, `New laws are getting longer: a median of ${fmt(f.med)} articles in ${f.span}, ${fmt(l.med)} in ${l.span}`),
    dek: L(`Çdo shirit është një periudhë: ligjet e reja sipas numrit të neneve që kishin kur u miratuan, pa ratifikimet, ligjet që miratojnë akte normative, ndryshimet e ligjeve të tjera dhe buxhetet. Ligjet me më shumë se 30 nene u rritën nga ${pct(big(f), f.pts.length)} në ${pct(big(l), l.pts.length)} të ligjeve të reja. Djathtas është mediana.`,
      `Each bar is one period: new laws by the number of articles they had when adopted, leaving out ratifications, laws approving normative acts, amendments of other laws and budgets. Laws with more than 30 articles rose from ${pct(big(f), f.pts.length)} to ${pct(big(l), l.pts.length)} of new laws. The median is on the right.`),
    draw(el) {
      const ramp = seqRamp(), colors = [0.2, 0.4, 0.6, 0.8, 1].map(ramp);
      legend(el, CN.map((x, i) => ({ c: colors[i], l: x })));
      bands(el, rows, ['b0', 'b1', 'b2', 'b3', 'b4'], colors, CN, { rowH: 38, label: (r, nw) => r.span, right: (r, nw) => L(`${fmt(r.med)} nene`, `${fmt(r.med)} articles`), l: 90, ln: 76, r: 90, rn: 76,
        tipExtra: d => trow(null, L('Ligje', 'Laws'), fmt(d.pts.length)) + trow(null, L('Mediana e neneve', 'Median articles'), fmt(d.med)) + trow(null, L('Më i gjati', 'Longest'), fmt(d3.max(d.pts, p => p[0])) + L(' nene', ' articles')) });
      const ex = D.c03.excluded;
      note(el, ['ligj/<viti>/<numri>/neni-*.md (versioni i parë)', 'ligj/<viti>/<numri>/hyrje.md'], fmt(sum(rows, r => r.pts.length)) + L(' ligje të reja', ' new laws'),
        L(`numërohen skedarët neni-*.md të versionit të parë, kur ky është ligji siç u miratua. Nuk përfshihen ${fmt(ex.ratif || 0)} ratifikime, ${fmt(ex.appr || 0)} ligje për miratimin e akteve normative, ${fmt(ex.amend || 0)} ligje ndryshuese dhe ${fmt(ex.budget || 0)} buxhete; lloji lexohet nga titulli dhe nga nenet e Kushtetutës në hyrje (rregullat në src/prep.py). Repozitori mban më shumë ligje që janë ende në fuqi, prandaj periudhat e vjetra kanë më pak ligje.`,
          `the neni-*.md files of the first version are counted, when that version is the law as adopted. Left out: ${fmt(ex.ratif || 0)} ratifications, ${fmt(ex.appr || 0)} laws approving normative acts, ${fmt(ex.amend || 0)} amending laws and ${fmt(ex.budget || 0)} budgets; the type is read from the title and from the articles of the Constitution in the preamble (rules in src/prep.py). The repository holds more of the laws still in force, so the older periods have fewer laws.`));
      table(el, [L('Periudha', 'Period'), ...CN, L('Ligje', 'Laws'), L('Mediana', 'Median')], rows.map(r => [r.span, r.b0, r.b1, r.b2, r.b3, r.b4, r.pts.length, r.med]));
    }
  };
});

chart('c04', el => {
  const R = D.c04, keys = ['elect', 'decree', 'committee', 'res', 'decl', 'other', 'untitled'];
  const KN = { elect: [L('Zgjedhje, emërime, shkarkime, pëlqime', 'Elections, appointments, dismissals, consents')], decree: [L('Dekrete të Presidentit (ministrat, kthimi i ligjeve)', 'Decrees of the President (ministers, returned laws)')],

  return {
    title: L(`Kuvendi përtej ligjeve: ${pct(T.elect, dec_)} e vendimeve të viteve 2000–2010 janë zgjedhje dhe emërime`, `The Assembly beyond laws: ${pct(T.elect, dec_)} of its 2000–2010 decisions are elections and appointments`),

      const cols = S8(), colors = [cols[0], cols[1], cols[2], cols[3], cols[6], css('--muted-mark'), css('--muted-mark') + '70'];
      legend(el, keys.map((k, i) => ({ c: colors[i], l: KN[k][0] })));
      stackedColumns(el, R, keys, colors, keys.map(k => KN[k][0]), { pad: 0.3, bw: 40, h: 280, topLabel: r => fmt(sum(keys, k => r[k] || 0)), every: 1, everyN: 2 });
      note(el, ['vendim/kuvendi-i-shqiperise/', 'rezolute/kuvendi-i-shqiperise/', 'deklarate/kuvendi-i-shqiperise/'], fmt(N) + L(' akte', ' acts'),
        L(`lloji lexohet nga fjalët e titullit (rregullat në src/prep.py); ${fmt(T.untitled)} akte kanë në regjistër vetëm numrin dhe datën. Përqindja në titull llogaritet mbi ${fmt(dec_)} vendimet me titull (pa rezolutat dhe deklaratat). Repozitori mban aktet e Kuvendit të botuara në Fletoren Zyrtare që QBZ i ka në regjistër për këto vite; vitet e tjera nuk janë ende këtu.`,
          `the type is read from the words of the title (rules in src/prep.py); ${fmt(T.untitled)} acts have only a number and a date in the record. The share in the title is of the ${fmt(dec_)} decisions with a title (resolutions and declarations aside). The repository holds the Assembly\'s acts published in the Official Journal that QBZ records for these years; other years are not here yet.`));
      table(el, [t('year'), ...keys.map(k => KN[k][0]), t('total')], R.map(r => [String(r.y), ...keys.map(k => r[k] || 0), sum(keys, k => r[k] || 0)]));
    }
  };
});

chart('c07', el => {
  const A = D.c06.acts.filter(a => a.days != null), N = A.length, med = d3.median(A, a => a.days), in45 = A.filter(a => a.days <= 45).length, late = A.filter(a => a.days > 45);
  // five-day bins, the last one up to the deadline (40-45), then everything later
  const B = d3.range(0, 40, 5).map(b => [b, b + 4]).concat([[40, 45], [46, 1e9]]);
  return {
    title: L(`Afati prej 45 ditësh: ${fmt(in45)} nga ${fmt(N)} akte normative u miratuan në afat, gjysma brenda ${fmt(med)} ditëve`, `The 45-day deadline: ${fmt(in45)} of ${fmt(N)} normative acts were approved in time, half within ${fmt(med)} days`),
    dek: L(`Sa ditë kaluan nga data e aktit normativ deri te miratimi i ligjit me të cilin Kuvendi e miratoi. Afati i nenit 101 është 45 ditë.` + (late.length ? ` Pas afatit u miratua ${late.map(a => `akti normativ nr. ${a.nr}, datë ${dateShort(a.d)}, pas ${a.days} ditësh (ligji nr. ${a.law})`).join('; ')}.` : ''),
      `How many days passed from the date of the normative act to the adoption of the law by which the Assembly approved it. The deadline of article 101 is 45 days.` + (late.length ? ` Approved after the deadline: ${late.map(a => `normative act No. ${a.nr} of ${dateShort(a.d)}, after ${a.days} days (Law No. ${a.law})`).join('; ')}.` : '')),
    draw(el) {
      const cols = S8(), ink = cols[0], warn = cols[7];
      const per = [['2000–2018', a => a.d < '2019'], ['2019–2026', a => a.d >= '2019']];
      const pc = [css('--muted-mark'), ink];
      legend(el, per.map((p, i) => ({ c: pc[i], l: L(`Akte të viteve ${p[0]}`, `Acts of ${p[0]}`) })).concat([{ c: warn, l: L('Pas 45 ditëve', 'After 45 days') }]));
      const w = W(el), nw = narrow(w), h = 270, m = { t: 30, r: 10, b: 36, l: 40 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b;
      const x = d3.scaleBand().domain(B.map((b, i) => i)).range([0, iw]).padding(0.12);
      const lab = b => b[1] > 1000 ? (nw ? `>${b[0] - 1}` : L(`mbi ${b[0] - 1}`, `over ${b[0] - 1}`)) : `${b[0]}–${b[1]}`;
      const rows = B.map((b, i) => ({ i, b, v: per.map(([, f]) => A.filter(a => f(a) && a.days >= b[0] && a.days <= b[1]).length) }));
      const y = d3.scaleLinear().domain([0, d3.max(rows, r => sum(r.v)) * 1.18]).nice().range([ih, 0]);
      yAxis(g, y, iw, 4);
      const labels = [];
      rows.forEach(r => {
        let acc = 0; const bw = x.bandwidth(), x0 = x(r.i), late_ = r.b[0] > 45;
        r.v.forEach((v, j) => {
          if (!v) return;
          const y0 = y(acc), y1 = y(acc + v); acc += v;
          const top = r.v.slice(j + 1).every(z => !z);
          g.append('path').attr('d', top ? colPath(x0, y0 - (j ? 1 : 0), bw, y1, 4) : `M${x0},${y0 - (j ? 1 : 0)}V${y1 + 1}H${x0 + bw}V${y0 - (j ? 1 : 0)}Z`).attr('fill', late_ ? warn : pc[j]);
        });
        labels.push([x0 + bw / 2, y(sum(r.v)) - 5, fmt(sum(r.v))]);
        g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', ih + 16).attr('text-anchor', 'middle').style('font-size', nw ? '9px' : null).text(lab(r.b));
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x0).attr('width', bw).attr('y', 0).attr('height', ih).datum(r),
          d => `<b>${lab(d.b)} ${t('days')}</b>` + per.map(([p], j) => trow(late_ ? warn : pc[j], L(`Akte të viteve ${p}`, `Acts of ${p}`), fmt(d.v[j]))).join(''));
      });
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      g.append('text').attr('class', 'lbl mut').attr('x', iw).attr('y', ih + 32).attr('text-anchor', 'end').text(L('ditë nga akti normativ te ligji që e miratoi', 'days from the normative act to the law approving it'));
      // a day's position on the binned axis
      const xd = d => { const i = B.findIndex(b => d >= b[0] && d <= b[1]); const b = B[i], wdt = Math.min(b[1], 50) - b[0] + 1; return x(i) + x.bandwidth() * Math.min(1, (d - b[0] + 0.5) / wdt); };
      const mark = (xx, lab_, anchor) => {
        g.append('line').attr('x1', xx).attr('x2', xx).attr('y1', -10).attr('y2', ih).attr('stroke', css('--text')).attr('stroke-dasharray', '3 3');
        g.append('text').attr('class', 'lbl strong').attr('x', xx + (anchor === 'start' ? 5 : -5)).attr('y', -16).attr('text-anchor', anchor).text(lab_);
      };
      mark(x(B.length - 1) - x.step() * x.paddingInner() / 2, nw ? L('afati 45 ditë', '45-day deadline') : L('afati: 45 ditë (neni 101)', 'deadline: 45 days (art. 101)'), 'end');
      mark(xd(med), L(`mediana: ${fmt(med)} ditë`, `median: ${fmt(med)} days`), 'end');
      // the counts on top of the columns, drawn last with a halo so the dashed lines never cross them
      labels.forEach(([lx, ly, tx]) => g.append('text').attr('class', 'lbl').attr('x', lx).attr('y', ly).attr('text-anchor', 'middle')
        .style('paint-order', 'stroke').style('stroke', css('--surface')).style('stroke-width', 4).text(tx));
      note(el, ['ligj/ („Për miratimin e aktit normativ, me fuqinë e ligjit, nr. …, datë …“)', 'ligj/<viti>/<numri>/zz-miratuar.md', 'data/laws.csv'], fmt(N) + L(' akte normative me ligj miratues', ' normative acts with an approving law'),
        L(`data e aktit normativ merret nga titulli i ligjit miratues, data e ligjit nga blloku i miratimit ose nga regjistri. Mediana: ${fmt(d3.median(A.filter(per[0][1]), a => a.days))} ditë në vitet 2000–2018, ${fmt(d3.median(A.filter(per[1][1]), a => a.days))} ditë në vitet 2019–2026. Aktet normative që Kuvendi nuk i miratoi nuk kanë ligj miratues dhe nuk janë këtu.`,
          `the date of the normative act comes from the title of the approving law, the law's date from its adoption block or the record. Median: ${fmt(d3.median(A.filter(per[0][1]), a => a.days))} days in 2000–2018, ${fmt(d3.median(A.filter(per[1][1]), a => a.days))} days in 2019–2026. Normative acts the Assembly did not approve have no approving law and are not here.`));
      table(el, [L('Ditë', 'Days'), ...per.map(p => L(`Akte ${p[0]}`, `Acts ${p[0]}`)), t('total')], rows.map(r => [lab(r.b), ...r.v, sum(r.v)]));
    }
  };

            d => `<b>${L(AREAS[d.k][0], AREAS[d.k][1])} · ${d.r.y}</b>` + trow(null, L('Vendime', 'Decisions'), fmt(d.r[d.k] || 0)) + trow(null, L('Pjesa e vitit', 'Share of the year'), pct(d.r[d.k] || 0, tot(d.r), 1)));

          `the proposer is read from the preamble; the area comes from the words of the minister's title (rules in src/prep.py), e.g. "minister of Finance and Economy" goes to finance, "deputy prime minister and minister of Infrastructure" to infrastructure. Decisions the repository holds as a single file (${fmt(PF.vkm - N)}) were not read. 2026 is partial.`));
      table(el, [t('year'), ...rank.map(k => L(AREAS[k][0], AREAS[k][1])), t('total')], Yr.map(r => [String(r.y), ...rank.map(k => r[k] || 0), tot(r)]));

          `orders with "protective" (or restrictive) "measures" against a disease that appeared in a state named in the title; the disease and the state are read from the title (rules in src/prep.py). Duration: from the day the order took effect to the day the act repealing it took effect. The last month is partial.`));
      const cnt = d3.rollups(O.flatMap(o => o.c.map(c => [c, kOf(o)])), z => z.length, z => z[0], z => z[1]);
      table(el, [L('Shteti', 'State'), ...names, t('total')], cnt.map(([c, v]) => { const m = new Map(v); return [ctry(c), ...keys.map(k => m.get(k) || 0), sum(v.map(z => z[1]))]; }).sort((a, b) => b[b.length - 1] - a[a.length - 1]));

  };
});

chart('c14', el => {
  const Wg = D.c14.wage, P = D.c14.pens, w0 = Wg[0], w1 = Wg[Wg.length - 1], miss = D.c14.missing;
  return {
    title: L(`Paga minimale: nga ${fmt(w0.v)} lekë në vitin ${w0.d.slice(0, 4)} në ${fmt(w1.v)} lekë në vitin ${w1.d.slice(0, 4)}`, `The minimum wage: from ${fmt(w0.v)} lek in ${w0.d.slice(0, 4)} to ${fmt(w1.v)} lek in ${w1.d.slice(0, 4)}`),
    dek: L(`Paga minimale mujore në shkallë vendi, siç e caktojnë vendimet e Këshillit të Ministrave, nga data që thotë vendimi; pika bosh shënon një vendim që repozitori e njeh, por teksti i të cilit nuk është këtu, kështu që shuma nuk dihet. Pranë saj: me sa për qind u rritën ose u indeksuan pensionet me çdo vendim.`,
      `The national monthly minimum wage as decisions of the Council of Ministers set it, from the date each decision gives; a hollow dot marks a decision the repository knows of but whose text it does not hold, so the amount is not known. Beside it: the percentage by which each decision raised or indexed pensions.`),
    draw(el) {
      const cols = S8(), box = el.append('div').attr('class', 'mini'), pa = box.append('div'), pb = box.append('div');
      const END = PF.built, x0d = new Date(2000, 0, 1), x1d = new Date(2027, 0, 1);
      pa.append('h4').text(L('Paga minimale, lekë në muaj', 'Minimum wage, lek a month'));
      pa.append('p').text(L('çdo pikë është një vendim i ri', 'each dot is a new decision'));
      const w = W(pa), h = 270, m = { t: 18, r: 14, b: 24, l: 50 };
      const svg = svgIn(pa, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b;
      const x = d3.scaleTime().domain([x0d, x1d]).range([0, iw]), y = d3.scaleLinear().domain([0, d3.max(Wg, r => r.v) * 1.1]).nice().range([ih, 0]);
      yAxis(g, y, iw, 4, v => fmt(v));
      x.ticks(narrow(w) ? 4 : 6).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 16).attr('text-anchor', 'middle').text(v.getFullYear()));
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      const ink = cols[0];
      // steps: each amount holds until the next decision, known or not
      const events = Wg.map(r => ({ d: r.d, v: r.v, r })).concat(miss.map(([a, d]) => ({ d, v: null, a }))).sort((a, b) => a.d.localeCompare(b.d));
      const segs = [];
      events.forEach((e, i) => { if (e.v == null) return; const nx = events[i + 1]; segs.push({ a: e.d, b: nx ? nx.d : END, v: e.v, open: nx && nx.v == null }); });
      const gfill = grad(svg, 'c14g', ink, .3);  // the area under each known amount only, never across a gap
      segs.forEach(s => g.append('rect').attr('x', x(PD(s.a))).attr('width', Math.max(0, x(PD(s.b)) - x(PD(s.a)))).attr('y', y(s.v)).attr('height', ih - y(s.v)).attr('fill', gfill));
      segs.forEach(s => g.append('path').attr('d', `M${x(PD(s.a))},${y(s.v)}H${x(PD(s.b))}`).attr('stroke', ink).attr('stroke-width', 2.2).attr('stroke-dasharray', s.open ? '4 3' : null));
      for (let i = 1; i < segs.length; i++) { const s = segs[i - 1], n = segs[i]; if (s.b === n.a) g.append('path').attr('d', `M${x(PD(n.a))},${y(s.v)}V${y(n.v)}`).attr('stroke', ink).attr('stroke-width', 2.2); }
      bindTip(g.append('g').selectAll('circle').data(Wg).join('circle').attr('cx', r => x(PD(r.d))).attr('cy', r => y(r.v)).attr('r', 3.4).attr('fill', ink).attr('stroke', css('--surface')).attr('stroke-width', 1.5),

      bindTip(g.append('g').selectAll('circle').data(miss).join('circle').attr('cx', r => x(PD(r[1]))).attr('cy', ih - 7).attr('r', 3.6).attr('fill', css('--surface')).attr('stroke', ink).attr('stroke-width', 1.5),
        r => `<b>${dateTxt(r[1])}</b>` + trow(null, L('Vendimi', 'Decision'), `${L('nr.', 'No.')} ${r[0]}`) + trow(null, '', L('teksti nuk është në repozitor', 'text not in the repository')));
      g.append('text').attr('class', 'lbl strong').attr('x', x(PD(w0.d)) + 2).attr('y', y(w0.v) - 9).text(fmt(w0.v));
      g.append('text').attr('class', 'lbl strong').attr('x', x(PD(w1.d)) - 7).attr('y', y(w1.v) + 4).attr('text-anchor', 'end').text(fmt(w1.v));
      // pensions
      pb.append('h4').text(L('Rritja dhe indeksimi i pensioneve, %', 'Pension rises and indexation, %'));
      pb.append('p').text(L('çdo shtyllë është një vendim', 'each column is one decision'));
      const w2 = W(pb), svg2 = svgIn(pb, w2, h), g2 = svg2.append('g').attr('transform', `translate(${36},${m.t})`), iw2 = w2 - 36 - 10;
      const xb = d3.scaleBand().domain(P.map(p => p.a)).range([0, iw2]).padding(0.22), yb = d3.scaleLinear().domain([0, d3.max(P, p => p.v) * 1.12]).nice().range([ih, 0]);
      yAxis(g2, yb, iw2, 4, v => dec(v, 0));
      g2.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw2).attr('y1', ih).attr('y2', ih);
      const ink2 = cols[2], every = xb.bandwidth() < 15 ? 2 : 1;
      P.forEach((p, i) => {
        const bx = xb(p.a), bw = xb.bandwidth();
        g2.append('path').attr('d', colPath(bx, ih, bw, yb(p.v), 3)).attr('fill', ink2);
        if (i % every === 0 || p.v >= 6) g2.append('text').attr('class', 'lbl').attr('x', bx + bw / 2).attr('y', yb(p.v) - 4).attr('text-anchor', 'middle').style('font-size', '10px').text(dec(p.v, p.v % 1 ? 1 : 0));
        if (i % (narrow(w2) ? 5 : 3) === 0) g2.append('text').attr('class', 'lbl').attr('x', bx + bw / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(p.d.slice(0, 4));
        bindTip(g2.append('rect').attr('class', 'hit').attr('x', bx).attr('width', bw).attr('y', 0).attr('height', ih).datum(p),
          d => `<b>${dateTxt(d.d)}</b>` + trow(ink2, L('Rritja', 'Rise'), pv(d.v, d.v % 1 ? 1 : 0)) + trow(null, L('Vendimi', 'Decision'), `${L('nr.', 'No.')} ${d.a}`));
      });
      note(el, ['vendim/<viti>/<numri>/pika-*.md (versioni i fundit i çdo vendimi)', 'registry/data/laws.csv', 'data/held.json'], fmt(Wg.length) + L(' vendime për pagën minimale, ', ' minimum wage decisions, ') + fmt(P.length) + L(' për pensionet', ' on pensions'),
        L(`shuma lexohet nga teksti („… të jetë 40 000 (dyzet mijë) lekë“), data nga „i shtrin efektet financiare nga data …“ ose, kur mungon, nga hyrja në fuqi. Pa tekst në repozitor: ${miss.map(r => `nr. ${r[0]}`).join(', ')}. Për pensionet merret norma e pikës 1 (pensionet e pleqërisë); vendimi i vitit 2000, me norma sipas shumës së pensionit, nuk përfshihet. Vendimet që vetëm ndryshojnë një vendim të mëparshëm nuk janë këtu.`,
          `the amount is read from the text ("… të jetë 40 000 (dyzet mijë) lekë"), the date from "i shtrin efektet financiare nga data …" (financial effect from) or, when missing, from the entry into force. No text in the repository: ${miss.map(r => `No. ${r[0]}`).join(', ')}. For pensions the rate in point 1 (old-age pensions) is used; the 2000 decision, with rates by pension amount, is left out. Decisions that only amend an earlier one are not here.`));
      table(el, [L('Nga', 'From'), L('Paga minimale (lekë)', 'Minimum wage (lek)'), L('Vendimi', 'Decision')], Wg.map(r => [r.d, r.v, r.a]));
    }
  };
});

chart('c16', el => {

          `most records hold only the number, the dates and the official link, because the decisions name private parties; the decisions of 2025 come from the Constitutional Court's site. ${fmt(D.c18.cc_changes.length)} Constitutional Court decisions are authors of changes in the history of the laws, because they changed their text. Days are shown for years with at least 5 decisions.`));
      table(el, [t('year'), ...names, t('total'), L('Ditë deri te botimi (mediana)', 'Days to publication (median)')], R.map(r => [String(r.y), ...keys.map(k => r[k] || 0), sum(keys, k => r[k] || 0), DY[r.y] ? DY[r.y][1] : '–']));

          const land = topojson.feature(WORLD, WORLD.objects.countries).features.filter(f => f.id !== '010');
          const proj = mk(w, h), path = d3.geoPath(proj);
          bindTip(svg.append('g').selectAll('path').data(land).join('path').attr('d', path).attr('stroke', css('--surface')).attr('stroke-width', .6)
            .attr('fill', f => f.id === '008' ? css('--s2') : rowOf(f) ? col(rowOf(f).n) : css('--surface-2')),
            f => { const r = rowOf(f); return f.id === '008' ? `<b>${L('Shqipëria', 'Albania')}</b>` : `<b>${r ? ctry(r.k) : esc(f.properties.name)}</b>` + trow(null, L('Ligje ratifikimi', 'Ratification laws'), fmt(r ? r.n : 0)); });
        });
      };
      const eu = { type: 'MultiPoint', coordinates: [[-10, 34], [42, 34], [-10, 60], [42, 60]] };
      map(pe, (w, h) => d3.geoConicConformal().parallels([40, 62]).rotate([-14, 0]).fitExtent([[0, 0], [w, h]], eu), 0.78);
      map(pw, (w, h) => d3.geoNaturalEarth1().fitExtent([[0, 0], [w, h]], { type: 'Sphere' }), 0.52);
      const fail = () => box.append('p').attr('class', 'note').text(L('Harta nuk u ngarkua (cdn.jsdelivr.net); numrat janë në grafikun më poshtë dhe në tabelë.', 'The map could not be loaded (cdn.jsdelivr.net); the numbers are in the chart below and the table.'));
      if (WORLD) draws.forEach(f => f()); else worldAtlas().then(() => draws.forEach(f => f())).catch(fail);
      const top = rows.slice(0, 16), dcol = [0.35, 0.62, 0.92].map(ramp), DN = ['2000–2009', '2010–2019', '2020–2026'];
      el.append('h4').style('margin', '18px 0 4px').style('font', '600 13px/1.3 Inter, sans-serif').text(L('Shtetet që përmenden më shpesh, sipas dhjetëvjeçarit', 'The states named most often, by decade'));
      legend(el, DN.map((l, i) => ({ c: dcol[i], l })));
      splitBars(el, top.map(r => ({ k: r.k, ...r.by })), ['00', '10', '20'], dcol, DN, { rowH: 22, l: 190, ln: 142, label: r => ctry(r.k) });
      note(el, ['ligj/<viti>/<numri>/ (titulli)', 'data/laws.csv', 'registry/data/laws.csv', 'data/held.json'], fmt(sum(rows, r => r.n)) + L(' përmendje shtetesh në ', ' state mentions in ') + fmt(c.n) + L(' ligje ratifikimi', ' ratification laws'),
        L(`shteti lexohet nga emri në titullin e ligjit (rregullat në src/prep.py); një ligj mund të numërohet për disa shtete, dhe një titull me më shumë se tre shtete numërohet si marrëveshje shumëpalëshe (${fmt(c.multi)} ligje pa shtet ose organizatë financuese). KfW numërohet te Gjermania. Kosova nuk ka kod numerik në hartë dhe gjendet me emër. Shtetet e vogla (Malta, Luksemburgu, Monako…) nuk duken në hartë; janë në tabelë. Harta: world-atlas (Natural Earth).`,
          `the state is read from its name in the title of the law (rules in src/prep.py); a law can count for several states, and a title naming more than three states counts as a multilateral agreement (${fmt(c.multi)} laws with no state or lender). KfW counts for Germany. Kosovo has no numeric code in the map and is matched by name. Small states (Malta, Luxembourg, Monaco…) are too small for the map; they are in the table. Map: world-atlas (Natural Earth).`));
      table(el, [L('Shteti', 'State'), ...DN, t('total')], rows.map(r => [ctry(r.k), r.by['00'] || 0, r.by['10'] || 0, r.by['20'] || 0, r.n]));
    }
  };
});

const SUBN = { loan: ['Hua, kredi dhe financime', 'Loans, credit and financing'], eu: ['Integrimi evropian', 'European integration'], security: ['Policia, krimi, kufijtë, vizat', 'Police, crime, borders, visas'],
  defence: ['Mbrojtja dhe armët', 'Defence and arms'], transport: ['Transporti', 'Transport'], trade: ['Tregtia dhe doganat', 'Trade and customs'],
  tax: ['Tatimet', 'Taxes'], social: ['Puna dhe sigurimet', 'Labour and social security'], env: ['Mjedisi dhe energjia', 'Environment and energy'],
  justice: ['Drejtësia dhe gjykatat', 'Justice and courts'], culture: ['Kultura, arsimi, shkenca', 'Culture, education, science'], rights: ['Të drejtat e njeriut, shtetësia', 'Human rights, citizenship'],
  invest: ['Investimet dhe koncesionet', 'Investment and concessions'], other: ['Të tjera', 'Other'] };
const LENN = { wb: ['Banka Botërore', 'World Bank'], state: ['Qeveri të tjera', 'Other governments'], kfw: ['KfW (Gjermania)', 'KfW (Germany)'], eu: ['Bashkimi Evropian', 'European Union'],
  ebrd: ['BERZH', 'EBRD'], arab: ['Fonde arabe dhe OPEC', 'Arab funds and OPEC'], eib: ['BEI', 'EIB'], isdb: ['Banka Islamike', 'Islamic Dev. Bank'],
  ceb: ['Banka e KE-së (BZHKE)', 'Council of Europe Bank'], imf: ['FMN', 'IMF'], other: ['Të tjerë', 'Others'] };
const LENF = { eib: ['Banka Evropiane e Investimeve', 'European Investment Bank'], isdb: ['Banka Islamike e Zhvillimit', 'Islamic Development Bank'],
  ceb: ['Banka e Zhvillimit e Këshillit të Evropës', 'Council of Europe Development Bank'], imf: ['Fondi Monetar Ndërkombëtar', 'International Monetary Fund'] };
chart('c20', el => {
  const SB = D.c20.subj, LN = D.c20.lend, N = D.c20.n, keys = ['00', '10', '20'], tot = r => sum(keys, k => r[k] || 0);
  const loan = SB.find(r => r.k === 'loan'), sorted = SB.slice().sort((a, b) => (a.k === 'other') - (b.k === 'other') || tot(b) - tot(a));
  const lens = LN.filter(r => tot(r)).sort((a, b) => (a.k === 'other') - (b.k === 'other') || tot(b) - tot(a));
  const wb = LN.find(r => r.k === 'wb');
  return {
    title: L(`Çfarë ratifikohet: ${pct(tot(loan), N)} e ligjeve të ratifikimit janë për hua dhe financime`, `What is ratified: ${pct(tot(loan), N)} of ratification laws are for loans and financing`),
    dek: L(`Ligjet e ratifikimit dhe të aderimit që nga viti 2000 sipas temës së marrëveshjes dhe, për huatë dhe financimet, sipas huadhënësit. Neni 121 i Kushtetutës kërkon ligj për marrëveshjet që marrin përsipër detyrime financiare. Banka Botërore përmendet në ${fmt(tot(wb))} ligje.`,
      `Laws of ratification and accession since 2000 by the subject of the agreement and, for loans and financing, by the lender. Article 121 of the Constitution requires a law for agreements that take on financial obligations. The World Bank is named in ${fmt(tot(wb))} laws.`),
    draw(el) {
      const ramp = seqRamp(), dcol = [0.35, 0.62, 0.92].map(ramp), DN = ['2000–2009', '2010–2019', '2020–2026'];
      legend(el, DN.map((l, i) => ({ c: dcol[i], l })));
      const box = el.append('div').attr('class', 'mini'), a = box.append('div'), b = box.append('div');
      a.append('h4').text(L('Tema e marrëveshjes', 'Subject of the agreement'));
      splitBars(a, sorted, keys, dcol, DN, { rowH: 24, l: 220, ln: 150, label: r => L(...SUBN[r.k]) });
      b.append('h4').text(L('Huadhënësi (hua dhe financime)', 'Lender (loans and financing)'));
      splitBars(b, lens, keys, dcol, DN, { rowH: 24, l: 200, ln: 150, label: r => L(...LENN[r.k]), tipExtra: d => LENF[d.k] ? `<div style="margin-top:3px;color:var(--text-2)">${esc(L(...LENF[d.k]))}</div>` : '' });
      note(el, ['ligj/<viti>/<numri>/ (titulli)', 'data/laws.csv', 'registry/data/laws.csv', 'data/held.json'], fmt(N) + L(' ligje ratifikimi', ' ratification laws'),
        L('tema dhe huadhënësi lexohen nga titulli (rregullat në src/prep.py); tema është rregulli i parë që përputhet, dhe një titull që nuk përputhet me asnjë shkon te „Të tjera“. Një ligj huaje mund të përmendë më shumë se një huadhënës; „Qeveri të tjera“ janë huatë e qeverive pa një bankë të përmendur.',
          'the subject and the lender are read from the title (rules in src/prep.py); the subject is the first rule that matches, and a title no rule matches goes to "Other". A loan law can name more than one lender; "Other governments" are loans from governments with no bank named.'));
      table(el, [L('Tema ose huadhënësi', 'Subject or lender'), ...DN, t('total')], sorted.map(r => [L(...SUBN[r.k]), ...keys.map(k => r[k] || 0), tot(r)])
        .concat(lens.map(r => [L('Huadhënësi: ', 'Lender: ') + L(...(LENF[r.k] || LENN[r.k])), ...keys.map(k => r[k] || 0), tot(r)])));
    }
  };
});

// reading order (chart numbers follow it)
const ORDER = ['p1', 'c01', 'c02', 'c03', 'c04', 'c05', 'p2', 'c06', 'c07', 'c08', 'c09', 'c10', 'c11', 'p3', 'c12', 'c13', 'c14', 'p4', 'c15', 'c16', 'p5', 'c17', 'c18', 'c19', 'c20'];
CH.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html(''), A = P.acts;
  const rows = [
    [L('Historia e gitit (çdo commit)', 'Git history (every commit)'), 'git log origin/main', fmt(P.commits), L(`çdo version në ditën kur hyri në fuqi; i fundit më ${dateTxt(P.last_in_force)}`, `every version on the day it took effect; the latest on ${dateTxt(P.last_in_force)}`), L('dy ndërtime: dosjet u riemërtuan më 4 nëntor 2026', 'two builds: the folders were renamed on 4 November 2026')],
    [L('Kushtetuta', 'Constitution'), 'kushtetuta/1998/', L('8 versione', '8 versions'), '1998–2022', L('teksti i vitit 1998 dhe 7 ligjet ndryshuese', 'the 1998 text and its 7 amending laws')],
    [L('Ligjet', 'Laws'), 'ligj/<viti>/<numri>/', fmt(P.laws), L(`${fmt(P.laws_live)} në fuqi; ${fmt(P.laws_known)} ligje të njohura gjithsej (edhe si akte ndryshuese ose të mbajtura mënjanë)`, `${fmt(P.laws_live)} in force; ${fmt(P.laws_known)} laws known in all (also as amending or held-back acts)`), L('kodet e para vitit 2000 kanë vetëm tekstin e sotëm', 'codes from before 2000 have only today\'s text')],
    [L('Aktet normative me fuqinë e ligjit', 'Normative acts with the force of law'), 'aktnormativ/', fmt(A.aktnormativ || 0), L(`${fmt(P.na)} të njohura nga ligjet që i miratuan`, `${fmt(P.na)} known from the laws approving them`), L('2000–2026', '2000–2026')],
    [L('Vendimet e Këshillit të Ministrave', 'Decisions of the Council of Ministers'), 'vendim/<viti>/<numri>/', fmt(P.vkm), L(`${fmt(P.vkm_live)} në fuqi`, `${fmt(P.vkm_live)} in force`), L('kryesisht vendimet në fuqi dhe ato të shfuqizuara më vonë', 'mostly decisions in force and those repealed later')],
    [L('Vendimet e organeve të tjera', 'Decisions of other bodies'), 'vendim/<institucioni>/', fmt(A.vendim_other || 0), L('Kuvendi, ERE, KKRT/AMA, Banka e Shqipërisë…', 'the Assembly, energy and media regulators, the Bank of Albania…'), L('kryesisht 2000–2010 dhe 2026', 'mostly 2000–2010 and 2026')],
    [L('Udhëzime dhe urdhra', 'Instructions and orders'), 'udhezim/ urdher/', fmt(P.minis), '1994–2026', L('emri i sotëm i ministrisë', 'today\'s name of the ministry')],
    [L('Vendime gjykatash', 'Court decisions'), 'caselaw/', fmt(A.caselaw || 0), '1992–2010, 2025–2026', L('kryesisht vetëm numri, datat dhe lidhja zyrtare', 'mostly only the number, dates and official link')],
    [L('Dekretet e Presidentit', 'Decrees of the President'), 'dekret/', fmt(A.dekret || 0), '1990–2013, 2026', L('shumica pa titull (persona)', 'most without a title (individuals)')],
    [L('Vendimet e këshillave bashkiakë', 'Municipal council decisions'), 'local/', fmt(P.local), L('20 këshilla', '20 councils'), L('nuk përdoren në këta grafikë', 'not used in these charts')],
    [L('Aktet e mbajtura mënjanë', 'Acts held back'), 'data/held.json', fmt(P.held), L('me numër, datë dhe titull', 'with number, date and title'), L('vetëm për numërimin e akteve', 'only for counting acts')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(v)}</code>` : esc(v));
}
function fitLeftLabels(fig) {
  fig.selectAll('svg text').each(function () {
    let room = null;
    if (this.getAttribute('data-fit')) room = +this.getAttribute('data-fit');
    else if (this.getAttribute('text-anchor') === 'end' && +this.getAttribute('x') < 0) room = this.getBoundingClientRect().right - this.ownerSVGElement.getBoundingClientRect().left - 2;
    if (room == null || this.getComputedTextLength() <= room) return;
    const full = this.textContent;
    d3.select(this).append('title').text(full);
    let lo = 0, hi = full.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; this.firstChild.nodeValue = full.slice(0, mid) + '…'; if (this.getComputedTextLength() <= room) lo = mid; else hi = mid - 1; }
    this.firstChild.nodeValue = full.slice(0, lo) + '…';
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG === 'sq' ? 'sq' : 'en';
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tl = t('tiles'), tv = [PF.commits, PF.laws, PF.vkm, PF.minis, PF.na, PF.acts.caselaw || 0];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html((v, i) => `<b>${fmt(v)}</b><span>${tl[i]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.sq, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dsq, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.sq, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    fitLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.title.split(':')[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('al-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('al-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
</script>
</body>
