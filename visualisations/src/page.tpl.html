<style>

}

  color-scheme: dark;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }

details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }

figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }

.dek { color: var(--text-2); margin: 0 0 12px; max-width: 820px; }

.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }

.plot { width: 100%; position: relative; }

.axis path { display: none; }

.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.5; }

details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }

details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.3 Inter, sans-serif; }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.3 Inter, sans-serif; overflow-wrap: anywhere; hyphens: auto; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.3 Inter, sans-serif; color: var(--text-2); }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.1 Inter, sans-serif; color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
.sub { margin: 18px 0 4px; font: 600 13px/1.3 Inter, sans-serif; }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 16px; }
  .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>
</head>

<script>
const DATA = /*DATA*/null;
</script>
<script>
"use strict";
const D = DATA.charts, PF = DATA.profile;
let LANG = 'sq';
try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'sq') LANG = q; else { const s = localStorage.getItem('al-viz-lang'); if (s === 'en' || s === 'sq') LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const t = localStorage.getItem('al-viz-theme'); if (t === 'light' || t === 'dark') THEME = t; } catch (e) {}

// ------------------------------------------------------------------ strings
const S = {
sq: {
  title: 'E drejta shqiptare në 20 grafikë',
  lede: 'Njëzet grafikë të ndërtuar vetëm me të dhënat e këtij repozitori: ligjet e Kuvendit dhe blloku i miratimit e i shpalljes në fund të tyre, aktet normative me fuqinë e ligjit, vendimet e Këshillit të Ministrave, udhëzimet dhe urdhrat e ministrave, Kushtetuta me ndryshimet e saj, vendimet e gjykatave të botuara në Fletoren Zyrtare dhe çdo version i këtyre akteve në historinë e gitit.',
  profile_h: 'Profili i të dhënave: çfarë u përdor dhe sa i plotë është',
  tbl: 'Tabela me të dhënat', src: 'Burimi në repozitor', n: 'Regjistrime', cover: 'Mbulimi', caveat: 'Kufizimi',
  ds: 'Të dhënat', foot: 'Ndërtuar nga repozitori lexifina/albania-law ({built}). Numrat i llogarit visualisations/src/prep.py nga historia e gitit, nga tekstet e akteve dhe nga tabelat në data/; faqen e përgatit build.py. Të gjithë grafikët janë përshkrues: tregojnë çfarë regjistrojnë burimet, jo pse.',
  tiles: ['commit-e në histori', 'ligje me tekst', 'vendime të Këshillit të Ministrave', 'udhëzime dhe urdhra', 'akte normative me fuqinë e ligjit', 'vendime gjykatash në Fletoren Zyrtare'],
  year: 'Viti', total: 'Gjithsej', share: 'Pjesa', count: 'Numri', partial: 'vit i paplotë', laws: 'ligje', days: 'ditë',
  gl: 'Grafikë për të drejtën e të gjitha vendeve, nga i gjithë global-law: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. Këtu janë vetëm grafikët për Shqipërinë.',
},
en: {
  title: 'Albanian law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: the laws of the Assembly and the block of adoption and promulgation at their end, the normative acts with the force of law, the decisions of the Council of Ministers, the instructions and orders of ministers, the Constitution and its amendments, court decisions published in the Official Journal (Fletorja Zyrtare), and every version of these acts in the git history.',
  profile_h: 'Data profile: what was used and how complete it is',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit',
  ds: 'Dataset', foot: 'Built from the lexifina/albania-law repository ({built}). The numbers are computed by visualisations/src/prep.py from the git history, the texts of the acts and the tables in data/; build.py assembles the page. All charts are descriptive: they show what the sources record, not why.',
  tiles: ['commits in the history', 'laws with text', 'decisions of the Council of Ministers', 'instructions and orders', 'normative acts with the force of law', 'court decisions in the Official Journal'],
  year: 'Year', total: 'Total', share: 'Share', count: 'Count', partial: 'partial year', laws: 'laws', days: 'days',
  gl: 'Charts on every country\'s law, from the whole of global-law: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. These are the charts on Albania alone.',
}};
const t = k => S[LANG][k];
const L = (sq, en) => LANG === 'sq' ? sq : en;
// Albanian: a dot between thousands and a decimal comma, as in this repository's README; English: en-GB
const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const fmt = n => (n == null ? '–' : LANG === 'sq' ? (Number.isInteger(+n) ? grp(String(Math.round(+n))) : dec(+n, 1)) : (+n).toLocaleString('en-GB'));
const dec = (v, d = 1) => { const s = (+v).toFixed(d); if (LANG !== 'sq') return s; const [a, b] = s.split('.'); return grp(a) + (b ? ',' + b : ''); };
const pv = (v, d = 0) => dec(v, d) + '%';
const pct = (a, b, d = 0) => b ? pv(100 * a / b, d) : '–';
const MSQ = ['janar', 'shkurt', 'mars', 'prill', 'maj', 'qershor', 'korrik', 'gusht', 'shtator', 'tetor', 'nëntor', 'dhjetor'];
const MEN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = { sq: ['jan', 'shk', 'mar', 'pri', 'maj', 'qer', 'kor', 'gus', 'sht', 'tet', 'nën', 'dhj'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
const WDN = { sq: ['e hënë', 'e martë', 'e mërkurë', 'e enjte', 'e premte', 'e shtunë', 'e diel'], en: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'] };
const dateTxt = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'sq' ? `${d} ${MSQ[m - 1]} ${y}` : `${d} ${MEN[m - 1]} ${y}`; };
const dateShort = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'sq' ? `${d}.${m}.${y}` : `${d} ${MON.en[m - 1]} ${y}`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const PD = s => d3.timeParse('%Y-%m-%d')(s);
const DAYS = (a, b) => Math.round((PD(b) - PD(a)) / 864e5);
const Cap = s => s.charAt(0).toUpperCase() + s.slice(1);
// Albanian nouns after a number: "1 ligj", "2 ligje"
const pl = (n, one, many) => `${fmt(n)} ${n === 1 ? one : many}`;

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); s.append('i').attr('class', it.shape || '').style('background', it.c).style('border-color', it.c); s.append('span').text(it.l); });
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }
function table(el, head, rows) {
  const d = el.append('details').attr('class', 'tbl');
  d.append('summary').text(t('tbl'));
  const tb = d.append('div').attr('class', 'scroll').append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => i ? 'n' : null).text(h => h);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => i ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
}
// path placeholders and the words around them, in English
const SRC_EN = [['<viti>', '<year>'], ['<numri>', '<number>'], ['<MMDD-numri>', '<MMDD-number>'], ['<institucioni>', '<institution>'], ['(versioni i parë)', '(first version)'],
  ['(versioni i fundit i çdo vendimi)', '(last version of each decision)'], ['(titulli)', '(title)'], ['(shfuqizimi: skedarët e fshirë)', '(repeal: files removed)'], ['(titujt ', '(titles ']];
function note(el, src, n, extra) {
  const p = el.append('p').attr('class', 'note');
  const tr = s => LANG === 'en' ? SRC_EN.reduce((a, [x, y]) => a.split(x).join(y), s) : s;
  p.html(`<b>${t('src')}:</b> ${src.map(s => `<code>${esc(tr(s))}</code>`).join(' ')} · <b>${t('n')}:</b> ${n}${extra ? ' · ' + esc(extra) : ''}`);
}
function yAxis(g, y, w, ticks = 5, f = fmt) {
  const ax = g.append('g').attr('class', 'axis grid');
  y.ticks(ticks).forEach(v => {
    ax.append('line').attr('x1', 0).attr('x2', w).attr('y1', y(v)).attr('y2', y(v));
    ax.append('text').attr('x', -6).attr('y', y(v)).attr('dy', '0.32em').attr('text-anchor', 'end').text(f(v));
  });
}
const W = el => Math.max(300, Math.min(1000, el.node().getBoundingClientRect().width || 900));
const WR = el => Math.max(120, el.node().getBoundingClientRect().width || 300);
const narrow = w => w < 560;
function colPath(x, y0, w, y1, r = 4) {
  const h = y0 - y1; if (h <= 0) return '';
  r = Math.min(r, h, w / 2);
  return `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + r}V${y0}Z`;
}
function barPath(x0, y, x1, h, r = 4) {
  const w = x1 - x0; if (w <= 0) return '';
  r = Math.min(r, w, h / 2);
  return `M${x0},${y}H${x1 - r}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${x1 - r},${y + h}H${x0}Z`;
}
// a diagonal-line pattern for spans the repository does not hold
let HATCH = 0;
function hatch(svg) {
  const id = 'hatch' + (++HATCH);
  const p = svg.append('defs').append('pattern').attr('id', id).attr('patternUnits', 'userSpaceOnUse').attr('width', 6).attr('height', 6).attr('patternTransform', 'rotate(45)');
  p.append('rect').attr('width', 6).attr('height', 6).attr('fill', css('--surface-2'));
  p.append('line').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 6).attr('stroke', css('--muted-mark')).attr('stroke-width', 1.4);
  return `url(#${id})`;
}
// stacked columns, keys bottom-up; the top segment gets the rounded end, 1px surface gaps
function stackedColumns(el, rows, keys, colors, names, opt = {}) {
  const w = W(el), h = opt.h || 300, m = { t: opt.mt || 14, r: 8, b: 26, l: opt.ml || 44 };
  const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const iw = w - m.l - m.r, ih = h - m.t - m.b;
  const x = d3.scaleBand().domain(rows.map(r => r.y)).range([0, iw]).padding(opt.pad == null ? 0.25 : opt.pad);
  const tot = r => keys.reduce((s, k) => s + (r[k] || 0), 0);
  const y = d3.scaleLinear().domain([0, opt.max || d3.max(rows, tot)]).nice().range([ih, 0]);
  const back = g.append('g');
  yAxis(g, y, iw, opt.ticks || 5, opt.yf);
  const bw = Math.min(opt.bw || 24, x.bandwidth());
  rows.forEach(r => {
    let acc = 0; const segs = keys.map((k, i) => ({ k, i, v: r[k] || 0 })).filter(s => s.v > 0);
    const gx = x(r.y) + (x.bandwidth() - bw) / 2;
    segs.forEach((s, j) => {
      const y0 = y(Math.min(acc, y.domain()[1])), y1 = y(Math.min(acc + s.v, y.domain()[1])); acc += s.v;
      const gap = j ? 1 : 0, top = j === segs.length - 1;
      const yy0 = y0 - gap, yy1 = top ? y1 : y1 + 1;
      if (yy0 - yy1 < 0.5) return;
      g.append('path').attr('d', top ? colPath(gx, yy0, bw, yy1, Math.min(4, bw / 3)) : `M${gx},${yy0}V${yy1}H${gx + bw}V${yy0}Z`).attr('fill', colors[s.i]).attr('opacity', opt.partial && opt.partial(r) ? 0.55 : 1);
    });
    if (opt.topLabel && tot(r) && (!opt.topIf || opt.topIf(r, narrow(w)))) g.append('text').attr('class', 'lbl').attr('x', gx + bw / 2).attr('y', y(Math.min(tot(r), y.domain()[1])) - 5).attr('text-anchor', 'middle').style('font-size', opt.topSize || null).text(opt.topLabel(r));
  });
  g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
  const every = narrow(w) && opt.everyN ? opt.everyN : (opt.every || Math.ceil(rows.length / Math.max(4, Math.floor(iw / 44))));
  rows.forEach((r, i) => { if ((opt.tick ? opt.tick(r, narrow(w)) : i % every === 0) || (!opt.tick && i === rows.length - 1 && (rows.length - 1) % every > every / 2)) g.append('text').attr('class', 'lbl').attr('x', x(r.y) + x.bandwidth() / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(opt.xf ? opt.xf(r.y) : r.y); });
  bindTip(g.selectAll('.hit').data(rows).join('rect').attr('class', 'hit').attr('x', r => x(r.y)).attr('width', x.bandwidth()).attr('y', 0).attr('height', ih),
    opt.tipf || (r => `<b>${opt.xf ? opt.xf(r.y) : r.y}${opt.partial && opt.partial(r) ? ' (' + t('partial') + ')' : ''}</b>` + keys.map((k, i) => (r[k] ? trow(colors[i], names[i], fmt(r[k]) + (opt.noShare ? '' : ` · ${pct(r[k], tot(r))}`)) : '')).reverse().join('') + trow(null, t('total'), fmt(tot(r)))));
  return { svg, g, back, x, y, iw, ih, bw, m };
}
// rows of 100% bands with rounded ends and the shares inside
function bands(el, rows, keys, colors, names, opt) {
  const w = W(el), nw = narrow(w), rowH = opt.rowH || 34, m = { t: 4, r: nw ? (opt.rn || 58) : (opt.r || 86), b: 22, l: nw ? (opt.ln || 52) : (opt.l || 90) };
  const h = m.t + m.b + rowH * rows.length, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const iw = w - m.l - m.r, x = d3.scaleLinear().domain([0, 1]).range([0, iw]);
  [0, .25, .5, .75, 1].forEach(v => g.append('text').attr('class', 'lbl mut').attr('x', x(v)).attr('y', rowH * rows.length + 14).attr('text-anchor', 'middle').text(pv(100 * v)));
  const id0 = 'bd' + (++HATCH);
  rows.forEach((r, i) => {
    const y0 = i * rowH + 6, bh = rowH - 12, tot = sum(keys, k => r[k] || 0), id = id0 + '_' + i;
    if (!tot) return;
    g.append('clipPath').attr('id', id).append('rect').attr('x', 0).attr('y', y0).attr('width', iw).attr('height', bh).attr('rx', bh / 2);
    const row = g.append('g').attr('clip-path', `url(#${id})`).attr('opacity', opt.partial && opt.partial(r) ? .55 : 1);
    let acc = 0;
    keys.forEach((k, j) => {
      const v = r[k] || 0; if (!v) return;
      const x0 = x(acc / tot), x1 = x((acc + v) / tot); acc += v;
      row.append('rect').attr('x', x0).attr('width', Math.max(0, x1 - x0 - (acc < tot ? 1.5 : 0))).attr('y', y0).attr('height', bh).attr('fill', colors[j]);
      if (x1 - x0 > 34) row.append('text').attr('class', 'lbl').attr('x', (x0 + x1) / 2).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'middle')
        .style('fill', inkOn(colors[j])).style('pointer-events', 'none').text(pct(v, tot));
    });
    g.append('text').attr('class', 'lbl strong').attr('x', -10).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'end').text(opt.label(r, nw));
    g.append('text').attr('class', 'lbl strong').attr('x', iw + 10).attr('y', y0 + bh / 2 + 4).text(opt.right(r, nw));
    bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', i * rowH).attr('height', rowH).datum(r),
      d => `<b>${esc(opt.label(d, false))}</b>` + keys.map((k, j) => d[k] ? trow(colors[j], names[j], `${fmt(d[k])} · ${pct(d[k], tot)}`) : '').join('') + (opt.tipExtra ? opt.tipExtra(d) : trow(null, t('total'), fmt(tot))));
  });
  return { svg, g, iw };
}
// horizontal bars split into segments (e.g. by decade), label on the left, total on the right
function splitBars(el, rows, keys, colors, names, opt) {
  const w = W(el), nw = narrow(w), rowH = opt.rowH || 26, m = { t: 2, r: opt.rr || 44, b: 4, l: nw ? (opt.ln || 120) : (opt.l || 230) };
  const svg = svgIn(el, w, m.t + m.b + rowH * rows.length), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const tot = r => sum(keys, k => r[k] || 0);
  const iw = w - m.l - m.r, x = d3.scaleLinear().domain([0, opt.max || d3.max(rows, tot)]).range([0, iw]);
  rows.forEach((r, i) => {
    const cy = i * rowH, bh = Math.min(15, rowH - 9);
    g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + rowH / 2 + 4).attr('text-anchor', 'end').text(opt.label(r, nw));
    let acc = 0; const segs = keys.map((k, j) => ({ k, j, v: r[k] || 0 })).filter(s => s.v);
    segs.forEach((s, q) => {
      const x0 = x(acc), x1 = x(acc + s.v); acc += s.v;
      const last = q === segs.length - 1;
      g.append('path').attr('d', last ? barPath(x0, cy + (rowH - bh) / 2, x1, bh, 3) : `M${x0},${cy + (rowH - bh) / 2}h${Math.max(0, x1 - x0 - 1)}v${bh}h${-Math.max(0, x1 - x0 - 1)}Z`).attr('fill', colors[s.j]);
    });
    g.append('text').attr('class', 'lbl').attr('x', x(tot(r)) + 6).attr('y', cy + rowH / 2 + 4).text(opt.right ? opt.right(r) : fmt(tot(r)));
    bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', cy).attr('height', rowH).datum(r),
      d => `<b>${esc(opt.label(d, false))}</b>` + keys.map((k, j) => d[k] ? trow(colors[j], names[j], fmt(d[k])) : '').join('') + trow(null, t('total'), fmt(tot(d))) + (opt.tipExtra ? opt.tipExtra(d) : ''));
  });
  return { svg, g, x, iw };
}

chart('c02', el => {

  return {
    title: L(`Kalendari i Kuvendit: ${pct(thu, N)} e ligjeve miratohen të enjten, ${pct(jul, N)} në korrik`, `The Assembly's calendar: ${pct(thu, N)} of laws are adopted on a Thursday, ${pct(jul, N)} in July`),
    dek: L(`Çdo rresht është një vit, çdo katror një muaj: sa më i errët, aq më shumë ligje miratoi Kuvendi atë muaj (sipas datës së miratimit të shënuar në ligj). Korriku (${pct(jul, N)}) dhe dhjetori (${pct(dcm, N)}) janë muajt më të ngarkuar; në gusht, në ${fmt(Y.length)} vjet, u miratuan vetëm ${pl(aug, 'ligj', 'ligje')}. Poshtë: ligjet sipas ditës së javës.`,
      `Each row is a year, each square a month: the darker, the more laws the Assembly adopted that month (by the date of adoption the law records). July (${pct(jul, N)}) and December (${pct(dcm, N)}) are the busiest months; in August, over ${Y.length} years, only ${aug === 1 ? 'one law was' : fmt(aug) + ' laws were'} adopted. Below: laws by weekday.`),
    draw(el) {

      const iw = w - m.l - m.r, cw = iw / 12, h = m.t + m.b + rowH * Y.length;
      const G = new Map(grid.map(([y, mm, n]) => [y + ':' + mm, n])), mx = d3.max(grid, x => x[2]);
      const ramp = seqRamp(), col = n => ramp(0.12 + 0.88 * Math.sqrt(n / mx));
      legend(el, [1, 5, 15, mx].map(n => ({ c: col(n), l: n === mx ? L(`${n} ligje në muaj`, `${n} laws in a month`) : String(n) })).concat([{ c: css('--surface-2'), l: L('muaj pa asnjë ligj', 'a month with no law') }]));
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      MON[LANG].forEach((mn, j) => g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', -7).attr('text-anchor', 'middle').text(nw ? mn.slice(0, 1).toUpperCase() : mn));
      const tot = y => sum(grid.filter(x => x[0] === y), x => x[2]), xb = d3.scaleLinear().domain([0, d3.max(Y, tot)]).range([0, m.r - (nw ? 28 : 44)]);
      Y.forEach((y, i) => {
        const cy = i * rowH;

          const n = G.get(y + ':' + mm) || 0;
          bindTip(g.append('rect').attr('x', (mm - 1) * cw + 1).attr('y', cy + 1).attr('width', cw - 2).attr('height', rowH - 2).attr('rx', 3).attr('fill', n ? col(n) : css('--surface-2')).datum({ y, mm, n }),
            d => `<b>${L(Cap(MSQ[d.mm - 1]), MEN[d.mm - 1])} ${d.y}</b>` + trow(null, L('Ligje të miratuara', 'Laws adopted'), fmt(d.n)));

      p.append('h4').style('margin', '0 0 4px').style('font', '600 13px/1.3 Inter, sans-serif').text(L('Ligjet sipas ditës së javës kur u miratuan', 'Laws by the weekday they were adopted'));
      const w2 = W(p), rh = 22, mm2 = { t: 2, r: 70, b: 2, l: nw ? 78 : 96 }, svg2 = svgIn(p, w2, mm2.t + mm2.b + rh * 7), g2 = svg2.append('g').attr('transform', `translate(${mm2.l},${mm2.t})`);
      const x2 = d3.scaleLinear().domain([0, d3.max(c.wd)]).range([0, w2 - mm2.l - mm2.r]);
      c.wd.forEach((n, i) => {
        g2.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', i * rh + 15).attr('text-anchor', 'end').text(Cap(WDN[LANG][i]));
        g2.append('path').attr('d', barPath(0, i * rh + 5, Math.max(2, x2(n)), 13, 3)).attr('fill', i === 3 ? css('--s1') : css('--muted-mark'));
        g2.append('text').attr('class', 'lbl').attr('x', Math.max(2, x2(n)) + 6).attr('y', i * rh + 15).text(`${fmt(n)} · ${pct(n, N)}`);
      });
      note(el, ['ligj/<viti>/<numri>/zz-miratuar.md („Miratuar në datën …“)', 'git log (Enacted:)', 'data/laws.csv', 'data/held.json'], fmt(N) + L(' ligje me datë miratimi', ' laws with an adoption date'),
        L(`data e miratimit merret nga blloku në fund të ligjit, përndryshe nga data e ligjit në regjistrin e QBZ-së. Viti 2026 shkon deri më ${dateTxt(PF.built)}.`, `the adoption date comes from the block at the end of the law, otherwise from the law's date in QBZ's record. 2026 runs to ${dateTxt(PF.built)}.`));
      table(el, [t('year'), ...MON[LANG], t('total')], Y.map(y => [String(y), ...d3.range(1, 13).map(mm => G.get(y + ':' + mm) || 0), tot(y)]));

chart('c05', el => {

  const tot = r => sum(keys, k => r[k] || 0), r21 = Y.find(r => r.y === 2021), r20 = Y.find(r => r.y === 2020);
  const M = c.cards.meta;
  return {
    title: L(`Shpallja e ligjeve: në vitin 2021, ${pct(r21.nodec, tot(r21))} e ligjeve u botuan pa dekret të Presidentit`, `Promulgation: in 2021, ${pct(r21.nodec, tot(r21))} of laws were published without a decree of the President`),
    dek: L(`Presidenti i Republikës e shpall ligjin e miratuar brenda 20 ditëve nga paraqitja e tij (neni 84 i Kushtetutës). Në fund të çdo ligji, teksti i botuar shënon datën e miratimit dhe dekretin e shpalljes („Shpallur me dekretin nr. …“). Gjatë periudhës së Ilir Metës, ${fmt(M.nodec)} nga ${fmt(M.n)} ligje nuk kanë dekret; në vitet 2020 dhe 2021 ishin ${fmt(r20.nodec + r21.nodec)}.`,
      `The President of the Republic promulgates an adopted law within 20 days of its submission (art. 84 of the Constitution). At the end of each law, the published text records the date of adoption and the decree of promulgation ("Shpallur me dekretin nr. …"). During Ilir Meta's period, ${fmt(M.nodec)} of ${fmt(M.n)} laws have no decree; in 2020 and 2021 there were ${fmt(r20.nodec + r21.nodec)}.`),
    draw(el) {
      legend(el, keys.map((k, i) => ({ c: colors[i], l: names[i] })));
      const cards = el.append('div').attr('class', 'ptiles');
      order.forEach(p => {
        const s = c.cards[p], d = cards.append('div').attr('class', 'ptile');
        d.append('div').attr('class', 'pn').text(PRESN[p]);
        d.append('div').attr('class', 'pv').html(`<b>${fmt(s.n)}</b> ${L('ligje', 'laws')}`);
        d.append('div').attr('class', 'ps').text(L(`mediana ${fmt(s.med)} ditë · ${fmt(s.nodec)} pa dekret`, `median ${fmt(s.med)} days · ${fmt(s.nodec)} without a decree`));
        const bar = d.append('div').attr('class', 'pbar');
        [['d20', s.dec - s.late], ['dlate', s.late], ['nodec', s.nodec]].forEach(([k, v]) => { if (v) bar.append('i').style('flex', v).style('background', colors[keys.indexOf(k)]); });
      });
      const rows = Y.map(r => ({ ...r }));

      // the Presidents' periods as shaded bands behind the columns
      const xs = y => sc.x(y) - sc.x.step() * sc.x.paddingInner() / 2;
      const pos = s => { const y = +s.slice(0, 4), f = DAYS(s.slice(0, 4) + '-01-01', s) / 365.25; return xs(Math.max(2000, Math.min(2026, y))) + (y >= 2000 && y <= 2026 ? f * sc.x.step() : 0); };
      order.forEach((p, i) => {
        const a = pos(c.terms[p][0]), b = i < order.length - 1 ? pos(c.terms[order[i + 1]][0]) : sc.iw;
        const x0 = Math.max(0, a), x1 = Math.min(sc.iw, b);
        if (i % 2 === 0) sc.back.append('rect').attr('x', x0).attr('width', Math.max(0, x1 - x0)).attr('y', -22).attr('height', sc.ih + 22).attr('rx', 6).attr('fill', css('--surface-2'));
        const nw = narrow(W(el)), sur = PRESN[p].split(' ')[1];
        if (x1 - x0 > sur.length * (nw ? 5.6 : 6.4)) sc.back.append('text').attr('class', 'lbl strong').attr('x', (x0 + x1) / 2).attr('y', -9).attr('text-anchor', 'middle').style('font-size', nw ? '10px' : null).text(sur);
      });
      note(el, ['ligj/<viti>/<numri>/zz-miratuar.md'], fmt(sum(rows, tot)) + L(' ligje', ' laws'),
        L('ditët numërohen nga data e miratimit deri te data e dekretit, të dyja siç i shënon teksti i botuar (afati i nenit 84 numërohet nga paraqitja e ligjit te Presidenti, që nuk shënohet). „Pa dekret“ do të thotë që teksti nuk përmban rreshtin „Shpallur me dekretin …“. Periudhat e Presidentëve fillojnë me dekretin e parë që secili nënshkroi midis këtyre ligjeve. Vetëm ligjet që kanë tekstin e tyre në repozitor; 2026 është vit i paplotë.',
          'days run from the date of adoption to the date of the decree, both as the published text records them (the 20 days of article 84 run from the submission of the law to the President, which is not recorded). "No decree" means the text has no line "Shpallur me dekretin …". Each President\'s period starts with the first decree they signed among these laws. Only laws whose text is in the repository; 2026 is partial.'));
      table(el, [L('Viti', 'Year'), ...names, t('total')], rows.map(r => [String(r.y), ...keys.map(k => r[k] || 0), tot(r)]));
      const nd = el.select('details.tbl:last-of-type .scroll');
      nd.append('h4').style('margin', '14px 0 6px').style('font', '600 13px/1.3 Inter, sans-serif').text(L('Ligjet pa dekret në tekstin e botuar', 'Laws with no decree in the published text'));
      const tb = nd.append('table');
      tb.append('thead').append('tr').selectAll('th').data([L('Ligji', 'Law'), L('Miratuar', 'Adopted'), L('Titulli', 'Title')]).join('th').text(x => x);
      tb.append('tbody').selectAll('tr').data(c.nodec).join('tr').selectAll('td').data(r => [`${r[0]}/${r[1]}`, r[2], r[3]]).join('td').text(x => x);
    }
  };
});

chart('c07', el => {
  const A = D.c06.acts.filter(a => a.days != null), N = A.length, med = d3.median(A, a => a.days), in45 = A.filter(a => a.days <= 45).length, late = A.filter(a => a.days > 45);
  // five-day bins, the last one up to the deadline (40-45), then everything later
  const B = d3.range(0, 40, 5).map(b => [b, b + 4]).concat([[40, 45], [46, 1e9]]);
  return {
    title: L(`Afati prej 45 ditësh: ${fmt(in45)} nga ${fmt(N)} akte normative u miratuan në afat, gjysma brenda ${fmt(med)} ditëve`, `The 45-day deadline: ${fmt(in45)} of ${fmt(N)} normative acts were approved in time, half within ${fmt(med)} days`),
    dek: L(`Sa ditë kaluan nga data e aktit normativ deri te miratimi i ligjit me të cilin Kuvendi e miratoi. Afati i nenit 101 është 45 ditë.` + (late.length ? ` Pas afatit u miratua ${late.map(a => `akti normativ nr. ${a.nr}, datë ${dateShort(a.d)}, pas ${a.days} ditësh (ligji nr. ${a.law})`).join('; ')}.` : ''),
      `How many days passed from the date of the normative act to the adoption of the law by which the Assembly approved it. The deadline of article 101 is 45 days.` + (late.length ? ` Approved after the deadline: ${late.map(a => `normative act No. ${a.nr} of ${dateShort(a.d)}, after ${a.days} days (Law No. ${a.law})`).join('; ')}.` : '')),
    draw(el) {
      const cols = S8(), ink = cols[0], warn = cols[7];
      const per = [['2000–2018', a => a.d < '2019'], ['2019–2026', a => a.d >= '2019']];
      const pc = [css('--muted-mark'), ink];
      legend(el, per.map((p, i) => ({ c: pc[i], l: L(`Akte të viteve ${p[0]}`, `Acts of ${p[0]}`) })).concat([{ c: warn, l: L('Pas 45 ditëve', 'After 45 days') }]));
      const w = W(el), nw = narrow(w), h = 270, m = { t: 30, r: 10, b: 36, l: 40 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b;
      const x = d3.scaleBand().domain(B.map((b, i) => i)).range([0, iw]).padding(0.12);
      const lab = b => b[1] > 1000 ? (nw ? `>${b[0] - 1}` : L(`mbi ${b[0] - 1}`, `over ${b[0] - 1}`)) : `${b[0]}–${b[1]}`;
      const rows = B.map((b, i) => ({ i, b, v: per.map(([, f]) => A.filter(a => f(a) && a.days >= b[0] && a.days <= b[1]).length) }));
      const y = d3.scaleLinear().domain([0, d3.max(rows, r => sum(r.v)) * 1.18]).nice().range([ih, 0]);
      yAxis(g, y, iw, 4);
      const labels = [];
      rows.forEach(r => {
        let acc = 0; const bw = x.bandwidth(), x0 = x(r.i), late_ = r.b[0] > 45;
        r.v.forEach((v, j) => {
          if (!v) return;
          const y0 = y(acc), y1 = y(acc + v); acc += v;
          const top = r.v.slice(j + 1).every(z => !z);
          g.append('path').attr('d', top ? colPath(x0, y0 - (j ? 1 : 0), bw, y1, 4) : `M${x0},${y0 - (j ? 1 : 0)}V${y1 + 1}H${x0 + bw}V${y0 - (j ? 1 : 0)}Z`).attr('fill', late_ ? warn : pc[j]);
        });
        labels.push([x0 + bw / 2, y(sum(r.v)) - 5, fmt(sum(r.v))]);
        g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', ih + 16).attr('text-anchor', 'middle').style('font-size', nw ? '9px' : null).text(lab(r.b));
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x0).attr('width', bw).attr('y', 0).attr('height', ih).datum(r),
          d => `<b>${lab(d.b)} ${t('days')}</b>` + per.map(([p], j) => trow(late_ ? warn : pc[j], L(`Akte të viteve ${p}`, `Acts of ${p}`), fmt(d.v[j]))).join(''));
      });
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      g.append('text').attr('class', 'lbl mut').attr('x', iw).attr('y', ih + 32).attr('text-anchor', 'end').text(L('ditë nga akti normativ te ligji që e miratoi', 'days from the normative act to the law approving it'));
      // a day's position on the binned axis
      const xd = d => { const i = B.findIndex(b => d >= b[0] && d <= b[1]); const b = B[i], wdt = Math.min(b[1], 50) - b[0] + 1; return x(i) + x.bandwidth() * Math.min(1, (d - b[0] + 0.5) / wdt); };
      const mark = (xx, lab_, anchor) => {
        g.append('line').attr('x1', xx).attr('x2', xx).attr('y1', -10).attr('y2', ih).attr('stroke', css('--text')).attr('stroke-dasharray', '3 3');
        g.append('text').attr('class', 'lbl strong').attr('x', xx + (anchor === 'start' ? 5 : -5)).attr('y', -16).attr('text-anchor', anchor).text(lab_);
      };
      mark(x(B.length - 1) - x.step() * x.paddingInner() / 2, nw ? L('afati 45 ditë', '45-day deadline') : L('afati: 45 ditë (neni 101)', 'deadline: 45 days (art. 101)'), 'end');
      mark(xd(med), L(`mediana: ${fmt(med)} ditë`, `median: ${fmt(med)} days`), 'end');
      // the counts on top of the columns, drawn last with a halo so the dashed lines never cross them
      labels.forEach(([lx, ly, tx]) => g.append('text').attr('class', 'lbl').attr('x', lx).attr('y', ly).attr('text-anchor', 'middle')
        .style('paint-order', 'stroke').style('stroke', css('--surface')).style('stroke-width', 4).text(tx));
      note(el, ['ligj/ („Për miratimin e aktit normativ, me fuqinë e ligjit, nr. …, datë …“)', 'ligj/<viti>/<numri>/zz-miratuar.md', 'data/laws.csv'], fmt(N) + L(' akte normative me ligj miratues', ' normative acts with an approving law'),
        L(`data e aktit normativ merret nga titulli i ligjit miratues, data e ligjit nga blloku i miratimit ose nga regjistri. Mediana: ${fmt(d3.median(A.filter(per[0][1]), a => a.days))} ditë në vitet 2000–2018, ${fmt(d3.median(A.filter(per[1][1]), a => a.days))} ditë në vitet 2019–2026. Aktet normative që Kuvendi nuk i miratoi nuk kanë ligj miratues dhe nuk janë këtu.`,
          `the date of the normative act comes from the title of the approving law, the law's date from its adoption block or the record. Median: ${fmt(d3.median(A.filter(per[0][1]), a => a.days))} days in 2000–2018, ${fmt(d3.median(A.filter(per[1][1]), a => a.days))} days in 2019–2026. Normative acts the Assembly did not approve have no approving law and are not here.`));
      table(el, [L('Ditë', 'Days'), ...per.map(p => L(`Akte ${p[0]}`, `Acts ${p[0]}`)), t('total')], rows.map(r => [lab(r.b), ...r.v, sum(r.v)]));
    }
  };
});

      const iw = w - m.l - m.r, ih = h - m.t - m.b;
      const x = d3.scaleTime().domain([x0d, x1d]).range([0, iw]), y = d3.scaleLinear().domain([0, d3.max(Wg, r => r.v) * 1.1]).nice().range([ih, 0]);

      x.ticks(narrow(w) ? 4 : 6).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 16).attr('text-anchor', 'middle').text(v.getFullYear()));
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      const ink = cols[0];
      // steps: each amount holds until the next decision, known or not
      const events = Wg.map(r => ({ d: r.d, v: r.v, r })).concat(miss.map(([a, d]) => ({ d, v: null, a }))).sort((a, b) => a.d.localeCompare(b.d));
      const segs = [];
      events.forEach((e, i) => { if (e.v == null) return; const nx = events[i + 1]; segs.push({ a: e.d, b: nx ? nx.d : END, v: e.v, open: nx && nx.v == null }); });
      const gfill = grad(svg, 'c14g', ink, .3);  // the area under each known amount only, never across a gap
      segs.forEach(s => g.append('rect').attr('x', x(PD(s.a))).attr('width', Math.max(0, x(PD(s.b)) - x(PD(s.a)))).attr('y', y(s.v)).attr('height', ih - y(s.v)).attr('fill', gfill));
      segs.forEach(s => g.append('path').attr('d', `M${x(PD(s.a))},${y(s.v)}H${x(PD(s.b))}`).attr('stroke', ink).attr('stroke-width', 2.2).attr('stroke-dasharray', s.open ? '4 3' : null));
      for (let i = 1; i < segs.length; i++) { const s = segs[i - 1], n = segs[i]; if (s.b === n.a) g.append('path').attr('d', `M${x(PD(n.a))},${y(s.v)}V${y(n.v)}`).attr('stroke', ink).attr('stroke-width', 2.2); }

      bindTip(g.append('g').selectAll('circle').data(miss).join('circle').attr('cx', r => x(PD(r[1]))).attr('cy', ih - 7).attr('r', 3.6).attr('fill', css('--surface')).attr('stroke', ink).attr('stroke-width', 1.5),
        r => `<b>${dateTxt(r[1])}</b>` + trow(null, L('Vendimi', 'Decision'), `${L('nr.', 'No.')} ${r[0]}`) + trow(null, '', L('teksti nuk është në repozitor', 'text not in the repository')));
      g.append('text').attr('class', 'lbl strong').attr('x', x(PD(w0.d)) + 2).attr('y', y(w0.v) - 9).text(fmt(w0.v));
      g.append('text').attr('class', 'lbl strong').attr('x', x(PD(w1.d)) - 7).attr('y', y(w1.v) + 4).attr('text-anchor', 'end').text(fmt(w1.v));
      // pensions
      pb.append('h4').text(L('Rritja dhe indeksimi i pensioneve, %', 'Pension rises and indexation, %'));
      pb.append('p').text(L('çdo shtyllë është një vendim', 'each column is one decision'));
      const w2 = W(pb), svg2 = svgIn(pb, w2, h), g2 = svg2.append('g').attr('transform', `translate(${36},${m.t})`), iw2 = w2 - 36 - 10;
      const xb = d3.scaleBand().domain(P.map(p => p.a)).range([0, iw2]).padding(0.22), yb = d3.scaleLinear().domain([0, d3.max(P, p => p.v) * 1.12]).nice().range([ih, 0]);
      yAxis(g2, yb, iw2, 4, v => dec(v, 0));
      g2.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw2).attr('y1', ih).attr('y2', ih);
      const ink2 = cols[2], every = xb.bandwidth() < 15 ? 2 : 1;

        if (i % (narrow(w2) ? 5 : 3) === 0) g2.append('text').attr('class', 'lbl').attr('x', bx + bw / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(p.d.slice(0, 4));
        bindTip(g2.append('rect').attr('class', 'hit').attr('x', bx).attr('width', bw).attr('y', 0).attr('height', ih).datum(p),
          d => `<b>${dateTxt(d.d)}</b>` + trow(ink2, L('Rritja', 'Rise'), pv(d.v, d.v % 1 ? 1 : 0)) + trow(null, L('Vendimi', 'Decision'), `${L('nr.', 'No.')} ${d.a}`));

        L(`shuma lexohet nga teksti („… të jetë 40 000 (dyzet mijë) lekë“), data nga „i shtrin efektet financiare nga data …“ ose, kur mungon, nga hyrja në fuqi. Pa tekst në repozitor: ${miss.map(r => `nr. ${r[0]}`).join(', ')}. Për pensionet merret norma e pikës 1 (pensionet e pleqërisë); vendimi i vitit 2000, me norma sipas shumës së pensionit, nuk përfshihet. Vendimet që vetëm ndryshojnë një vendim të mëparshëm nuk janë këtu.`,
          `the amount is read from the text ("… të jetë 40 000 (dyzet mijë) lekë"), the date from "i shtrin efektet financiare nga data …" (financial effect from) or, when missing, from the entry into force. No text in the repository: ${miss.map(r => `No. ${r[0]}`).join(', ')}. For pensions the rate in point 1 (old-age pensions) is used; the 2000 decision, with rates by pension amount, is left out. Decisions that only amend an earlier one are not here.`));
      table(el, [L('Nga', 'From'), L('Paga minimale (lekë)', 'Minimum wage (lek)'), L('Vendimi', 'Decision')], Wg.map(r => [r.d, r.v, r.a]));

  'Çdo version i një akti është një commit në ditën kur hyri në fuqi, dhe çdo shfuqizim është një version i fundit bosh. Këtu numërohen versionet e reja dhe shfuqizimet e ligjeve, vendimeve, udhëzimeve dhe urdhrave.',
  'Every version of an act is a commit on the day it took effect, and every repeal is an empty last version. Here the new versions and the repeals of laws, decisions, instructions and orders are counted.');

chart('c15', el => {

      stackedColumns(b, RP, rk, rc, rn, { h: 250, pad: 0.18, partial: r => r.y === 2026, every: 5, everyN: 5 });

        L('një version i ri është një ditë e re hyrjeje në fuqi për një akt, pas versionit të tij të parë; të dy ndërtimet e historisë (para dhe pas riemërtimit të dosjeve më 4 nëntor 2026) numërohen një herë. Një ndryshim ka version këtu vetëm kur QBZ ka botuar tekstin e konsoliduar; aktet që QBZ nuk i konsolidon kanë vetëm tekstin siç u botuan. Shfuqizimi është dita kur u hoqën skedarët e fundit të aktit; tërheqjet nga ky repozitor nuk numërohen. 2026 është vit i paplotë.',

chart('c16', el => {

  return {

    dek: L(`Çdo rresht është një akt, çdo katror një vit: sa më i errët, aq më shumë versione të reja hynë në fuqi atë vit. ${fmt(recon)} nga ${fmt(R.length)} aktet janë vendime për përdorimin e fondit të rindërtimit pas tërmetit të vitit 2019. Djathtas: versionet e reja gjithsej.`,
      `Each row is one act, each square one year: the darker, the more new versions took effect that year. ${fmt(recon)} of the ${fmt(R.length)} acts are decisions on the use of the reconstruction fund after the 2019 earthquake. On the right: the new versions in total.`),

      legend(el, [1, 2, 4, mx].filter((v, i, a) => a.indexOf(v) === i).map(n => ({ c: col(n), l: n === mx ? L(`${n} versione në vit`, `${n} versions a year`) : String(n) })).concat([{ c: css('--surface-2'), l: L('vit pa version të ri', 'a year with no new version') }]));

      table(el, [L('Akti', 'Act'), L('Dosja', 'Folder'), ...YRS.map(String), t('total')], R.map(r => [actName(r), r.a, ...YRS.map(y => r.by[y] || 0), r.n]));
    }

});

      `Laws of ratification and accession since 2000 by the subject of the agreement and, for loans and financing, by the lender. Article 121 of the Constitution requires a law for agreements that take on financial obligations. The World Bank is named in ${fmt(tot(wb))} laws.`),
    draw(el) {
      const ramp = seqRamp(), dcol = [0.35, 0.62, 0.92].map(ramp), DN = ['2000–2009', '2010–2019', '2020–2026'];
      legend(el, DN.map((l, i) => ({ c: dcol[i], l })));
      const box = el.append('div').attr('class', 'mini'), a = box.append('div'), b = box.append('div');
      a.append('h4').text(L('Tema e marrëveshjes', 'Subject of the agreement'));
      splitBars(a, sorted, keys, dcol, DN, { rowH: 24, l: 220, ln: 150, label: r => L(...SUBN[r.k]) });
      b.append('h4').text(L('Huadhënësi (hua dhe financime)', 'Lender (loans and financing)'));
      splitBars(b, lens, keys, dcol, DN, { rowH: 24, l: 200, ln: 150, label: r => L(...LENN[r.k]), tipExtra: d => LENF[d.k] ? `<div style="margin-top:3px;color:var(--text-2)">${esc(L(...LENF[d.k]))}</div>` : '' });
      note(el, ['ligj/<viti>/<numri>/ (titulli)', 'data/laws.csv', 'registry/data/laws.csv', 'data/held.json'], fmt(N) + L(' ligje ratifikimi', ' ratification laws'),
        L('tema dhe huadhënësi lexohen nga titulli (rregullat në src/prep.py); tema është rregulli i parë që përputhet, dhe një titull që nuk përputhet me asnjë shkon te „Të tjera“. Një ligj huaje mund të përmendë më shumë se një huadhënës; „Qeveri të tjera“ janë huatë e qeverive pa një bankë të përmendur.',
          'the subject and the lender are read from the title (rules in src/prep.py); the subject is the first rule that matches, and a title no rule matches goes to "Other". A loan law can name more than one lender; "Other governments" are loans from governments with no bank named.'));
      table(el, [L('Tema ose huadhënësi', 'Subject or lender'), ...DN, t('total')], sorted.map(r => [L(...SUBN[r.k]), ...keys.map(k => r[k] || 0), tot(r)])
        .concat(lens.map(r => [L('Huadhënësi: ', 'Lender: ') + L(...(LENF[r.k] || LENN[r.k])), ...keys.map(k => r[k] || 0), tot(r)])));
    }
  };
});

// reading order (chart numbers follow it)
const ORDER = ['p1', 'c01', 'c02', 'c03', 'c04', 'c05', 'p2', 'c06', 'c07', 'c08', 'c09', 'c10', 'c11', 'p3', 'c12', 'c13', 'c14', 'p4', 'c15', 'c16', 'p5', 'c17', 'c18', 'c19', 'c20'];
CH.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html(''), A = P.acts;
  const rows = [
    [L('Historia e gitit (çdo commit)', 'Git history (every commit)'), 'git log origin/main', fmt(P.commits), L(`çdo version në ditën kur hyri në fuqi; i fundit më ${dateTxt(P.last_in_force)}`, `every version on the day it took effect; the latest on ${dateTxt(P.last_in_force)}`), L('dy ndërtime: dosjet u riemërtuan më 4 nëntor 2026', 'two builds: the folders were renamed on 4 November 2026')],
    [L('Kushtetuta', 'Constitution'), 'kushtetuta/1998/', L('8 versione', '8 versions'), '1998–2022', L('teksti i vitit 1998 dhe 7 ligjet ndryshuese', 'the 1998 text and its 7 amending laws')],
    [L('Ligjet', 'Laws'), 'ligj/<viti>/<numri>/', fmt(P.laws), L(`${fmt(P.laws_live)} në fuqi; ${fmt(P.laws_known)} ligje të njohura gjithsej (edhe si akte ndryshuese ose të mbajtura mënjanë)`, `${fmt(P.laws_live)} in force; ${fmt(P.laws_known)} laws known in all (also as amending or held-back acts)`), L('kodet e para vitit 2000 kanë vetëm tekstin e sotëm', 'codes from before 2000 have only today\'s text')],
    [L('Aktet normative me fuqinë e ligjit', 'Normative acts with the force of law'), 'aktnormativ/', fmt(A.aktnormativ || 0), L(`${fmt(P.na)} të njohura nga ligjet që i miratuan`, `${fmt(P.na)} known from the laws approving them`), L('2000–2026', '2000–2026')],
    [L('Vendimet e Këshillit të Ministrave', 'Decisions of the Council of Ministers'), 'vendim/<viti>/<numri>/', fmt(P.vkm), L(`${fmt(P.vkm_live)} në fuqi`, `${fmt(P.vkm_live)} in force`), L('kryesisht vendimet në fuqi dhe ato të shfuqizuara më vonë', 'mostly decisions in force and those repealed later')],
    [L('Vendimet e organeve të tjera', 'Decisions of other bodies'), 'vendim/<institucioni>/', fmt(A.vendim_other || 0), L('Kuvendi, ERE, KKRT/AMA, Banka e Shqipërisë…', 'the Assembly, energy and media regulators, the Bank of Albania…'), L('kryesisht 2000–2010 dhe 2026', 'mostly 2000–2010 and 2026')],
    [L('Udhëzime dhe urdhra', 'Instructions and orders'), 'udhezim/ urdher/', fmt(P.minis), '1994–2026', L('emri i sotëm i ministrisë', 'today\'s name of the ministry')],
    [L('Vendime gjykatash', 'Court decisions'), 'caselaw/', fmt(A.caselaw || 0), '1992–2010, 2025–2026', L('kryesisht vetëm numri, datat dhe lidhja zyrtare', 'mostly only the number, dates and official link')],
    [L('Dekretet e Presidentit', 'Decrees of the President'), 'dekret/', fmt(A.dekret || 0), '1990–2013, 2026', L('shumica pa titull (persona)', 'most without a title (individuals)')],
    [L('Vendimet e këshillave bashkiakë', 'Municipal council decisions'), 'local/', fmt(P.local), L('20 këshilla', '20 councils'), L('nuk përdoren në këta grafikë', 'not used in these charts')],
    [L('Aktet e mbajtura mënjanë', 'Acts held back'), 'data/held.json', fmt(P.held), L('me numër, datë dhe titull', 'with number, date and title'), L('vetëm për numërimin e akteve', 'only for counting acts')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(v)}</code>` : esc(v));
}
function fitLeftLabels(fig) {
  fig.selectAll('svg text').each(function () {
    let room = null;
    if (this.getAttribute('data-fit')) room = +this.getAttribute('data-fit');
    else if (this.getAttribute('text-anchor') === 'end' && +this.getAttribute('x') < 0) room = this.getBoundingClientRect().right - this.ownerSVGElement.getBoundingClientRect().left - 2;
    if (room == null || this.getComputedTextLength() <= room) return;
    const full = this.textContent;
    d3.select(this).append('title').text(full);
    let lo = 0, hi = full.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; this.firstChild.nodeValue = full.slice(0, mid) + '…'; if (this.getComputedTextLength() <= room) lo = mid; else hi = mid - 1; }
    this.firstChild.nodeValue = full.slice(0, lo) + '…';
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG === 'sq' ? 'sq' : 'en';
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tl = t('tiles'), tv = [PF.commits, PF.laws, PF.vkm, PF.minis, PF.na, PF.acts.caselaw || 0];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html((v, i) => `<b>${fmt(v)}</b><span>${tl[i]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.sq, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dsq, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.sq, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    fitLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.title.split(':')[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('al-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('al-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
</script>
</body>
